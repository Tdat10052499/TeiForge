name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check teiforge tests examples
      - name: Ruff format
        run: ruff format --check teiforge tests examples
      - name: Mypy
        run: mypy teiforge

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest --cov=teiforge --cov-report=term-missing --cov-fail-under=85

  build:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
      - name: Smoke-test the installed package
        working-directory: /tmp
        run: |
          /tmp/smoke/bin/python -c "import importlib.metadata as m, teiforge; assert m.version('teiforge') == teiforge.__version__"
          /tmp/smoke/bin/teiforge version
          /tmp/smoke/bin/teiforge tools
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
